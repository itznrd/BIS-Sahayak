description = "Thin-server RAG backend for the SIH BIS Standards Assistant"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "scikit-learn>=1.3",
    "rich>=13.0",
]